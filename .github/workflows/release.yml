name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          lipo -create \
            .build/arm64-apple-macosx/release/PurelyTab \
            .build/x86_64-apple-macosx/release/PurelyTab \
            -output .build/release/PurelyTab
          lipo -info .build/release/PurelyTab

      - name: Package app bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          APP_NAME="PurelyTab"
          APP_PATH="build/${APP_NAME}.app"

          mkdir -p "${APP_PATH}/Contents/MacOS"
          mkdir -p "${APP_PATH}/Contents/Resources"

          # 可执行文件
          cp ".build/release/${APP_NAME}" "${APP_PATH}/Contents/MacOS/"

          # 使用仓库里的 Info.plist，只替换版本号
          sed "s/<string>1.0.0<\/string>/<string>${VERSION}<\/string>/g" \
            Resources/Info.plist > "${APP_PATH}/Contents/Info.plist"

          # 本地化资源
          cp -R Resources/en.lproj    "${APP_PATH}/Contents/Resources/" 2>/dev/null || true
          cp -R Resources/zh_CN.lproj "${APP_PATH}/Contents/Resources/" 2>/dev/null || true

          # 图标
          if [ -f "PurelyTab.icns" ]; then
            cp PurelyTab.icns "${APP_PATH}/Contents/Resources/AppIcon.icns"
          fi

      - name: Sign app bundle
        run: |
          APP_PATH="build/PurelyTab.app"

          # Ad-hoc 签名，带 entitlements 和 hardened runtime
          # CGEventTap / AX 权限依赖此步骤正确执行
          codesign --force --deep \
            --sign - \
            --entitlements Resources/Entitlements.plist \
            --options runtime \
            "${APP_PATH}"

          # 验证签名
          codesign --verify --verbose "${APP_PATH}"
          echo "✅ Code signing OK"

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          APP_NAME="PurelyTab"
          DMG_NAME="${APP_NAME}-${VERSION}.dmg"

          TMP_DIR="/tmp/${APP_NAME}_dmg"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          cp -R "build/${APP_NAME}.app" "$TMP_DIR/"
          ln -s /Applications "$TMP_DIR/Applications"

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "$TMP_DIR" \
            -ov -format UDZO \
            "build/${DMG_NAME}"

          rm -rf "$TMP_DIR"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Verify DMG contents
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          DMG_NAME="PurelyTab-${VERSION}.dmg"
          hdiutil attach "build/${DMG_NAME}" -mountpoint /tmp/verify_dmg
          codesign --verify --verbose "/tmp/verify_dmg/PurelyTab.app"
          echo "✅ DMG verification OK"
          hdiutil detach /tmp/verify_dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.DMG_NAME }}
          generate_release_notes: true
